<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Participantes - Promoción 2026</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="admin-container">

        <h1>Registrar Participante</h1>
        <h2>Promoción 2026</h2>

        <!-- ================= FORMULARIO DE REGISTRO ================= -->
        <form id="formParticipante" class="form-tareas">

            <label for="grado">Carrera</label>
            <select id="grado">
                <option value="">Seleccione carrera existente</option>
            </select>

            <label for="gradoNuevo">O escriba una carrera nueva</label>
            <input type="text" id="gradoNuevo" placeholder="Ej. Quinto Turismo">

            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Ej. Pérez López Juan Carlos" required>

            <label for="numero">Número (correlativo dentro de la carrera)</label>
            <input type="number" id="numero" min="1" required>

            <button type="submit">Registrar Participante</button>

            <p id="mensajeEstado"></p>
        </form>

        <hr>

        <!-- ================= LISTA DE PARTICIPANTES ================= -->
        <h2>Participantes Registrados</h2>

        <select id="filtroGrado">
            <option value="">Todas las carreras</option>
        </select>

        <div id="listaParticipantes"></div>

    </div>

    <script type="module" src="js/registrar.js"></script>

</body>
</html>
